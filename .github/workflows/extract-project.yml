name: Extract project ZIP into repository

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project files into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="StewardBridge_MongoDB_Cloudflare_GitHub_Deploy_v28.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP is already extracted; nothing to do."
            exit 0
          fi

          mkdir -p /tmp/stewardbridge-unpack
          unzip -q "$ZIP_FILE" -d /tmp/stewardbridge-unpack
          if [ ! -d /tmp/stewardbridge-unpack/project ]; then
            echo "Expected project/ folder was not found in the ZIP."
            exit 1
          fi

          cp -a /tmp/stewardbridge-unpack/project/. .
          rm -f "$ZIP_FILE"
          rm -f .github/workflows/extract-project.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "Extract Steward Bridge Hospitality project from ZIP"
          git push origin HEAD:main
